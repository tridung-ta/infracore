<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOCK · Kiểm nhập liệu InfraCore</title><link rel="stylesheet" href="/assets/ita/css/ita-tokens.css"><link rel="stylesheet" href="/assets/ita/css/ita-shell.css"><link rel="stylesheet" href="/assets/ita/css/ita-refinements.css"><script src="/assets/ita/js/ita-form-guidance.js" defer></script><script src="/assets/ita/mock/form-validation.js" defer></script></head>
<body class="mock-validation"><link rel="stylesheet" href="/assets/ita/mock/form-validation.css"><main><h1>MOCK · Thử nhập liệu</h1><p>Dữ liệu giả, không có kết nối DB hoặc ghi tài sản. Dùng cùng bộ kiểm FE mới của ứng dụng.</p><p><a href="/?devices=1#network">Xem sáu thiết bị 3D</a> · <a href="/#assignments">Xem phân bổ / thu hồi</a></p>
<form class="panel import-step"><h2>Thông tin tài sản</h2><div class="detail-grid">
<div><label for="edit-asset_code">Mã tài sản</label><input id="edit-asset_code" class="form-control" maxlength="64" required></div>
<div><label for="edit-name">Tên tài sản</label><input id="edit-name" class="form-control" maxlength="200" required></div>
<div><label for="edit-purchase_date">Ngày mua</label><input id="edit-purchase_date" class="form-control" type="date"></div>
<div><label for="edit-warranty_end">Bảo hành đến</label><input id="edit-warranty_end" class="form-control" type="date"></div>
<div><label for="edit-purchase_price">Giá mua (VND)</label><input id="edit-purchase_price" class="form-control" maxlength="19"></div>
</div><button class="primary-button" type="submit">Kiểm tra dữ liệu giả</button><p class="admin-message" role="status"></p></form>
<form class="panel import-step"><h2>Thời hạn giấy phép</h2><div class="detail-grid"><div><label for="license-start">Ngày bắt đầu</label><input id="license-start" class="form-control" type="date"></div><div><label for="license-expire">Ngày hết hạn</label><input id="license-expire" class="form-control" type="date"></div><div><label for="license-seats">Số chỗ</label><input id="license-seats" class="form-control" type="number" min="1" max="1000000" required></div></div><button class="primary-button" type="submit">Kiểm tra giấy phép giả</button><p class="admin-message" role="status"></p></form>
</main></body></html>
