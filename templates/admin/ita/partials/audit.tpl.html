<section id="audit-panel" class="admin-panel panel" hidden aria-labelledby="audit-title">
 <div class="panel-heading"><div><h2 id="audit-title">Nhật ký thao tác</h2><p class="muted">Chọn thao tác, người thực hiện và khoảng thời gian cần tra cứu.</p></div></div>
 <form id="audit-filters" class="audit-filters" role="search">
  <div><label for="audit-action">Thao tác cần tìm</label><select id="audit-action" class="form-select"><option value="">Tất cả thao tác</option></select></div>
  <div><label for="audit-user">Người thực hiện</label><select id="audit-user" class="form-select"><option value="">Tất cả mọi người</option></select><small id="audit-people-help" class="field-guidance">Chọn theo tên, không cần nhớ mã số.</small><button id="audit-people-more" class="audit-text-button" type="button" hidden>Tải thêm tài khoản</button></div>
  <div><label for="audit-from">Từ ngày</label><input type="date" id="audit-from" class="form-control"></div>
  <div><label for="audit-to">Đến ngày</label><input type="date" id="audit-to" class="form-control"></div>
  <div class="audit-filter-actions"><button class="primary-button" type="submit">Tìm nhật ký</button><button id="audit-reset" class="secondary-button" type="button">Xóa bộ lọc</button></div>
  <div class="audit-date-shortcuts" role="group" aria-label="Khoảng thời gian nhanh"><span>Chọn nhanh:</span><button type="button" class="secondary-button" data-audit-days="1">Hôm nay</button><button type="button" class="secondary-button" data-audit-days="7">7 ngày</button><button type="button" class="secondary-button" data-audit-days="30">30 ngày</button><button type="button" class="secondary-button" data-audit-days="0">Mọi thời điểm</button></div>
 </form>
 <p id="audit-message" class="admin-message" role="status" aria-live="polite"></p>
 <div class="admin-table-wrap"><table class="asset-table audit-table"><caption class="visually-hidden">Sự kiện theo bộ lọc; thời gian Việt Nam</caption><thead><tr><th scope="col">Thời gian</th><th scope="col">Người thực hiện</th><th scope="col">Thao tác</th><th scope="col">Đối tượng</th><th scope="col">Nội dung thay đổi</th></tr></thead><tbody id="audit-rows"></tbody></table></div>
 <div class="table-footer"><span id="audit-page-summary"></span><nav aria-label="Phân trang nhật ký" class="pagination-controls"><button class="secondary-button" type="button" id="audit-previous">Trước</button><button class="secondary-button" type="button" id="audit-next">Sau</button></nav></div>
</section>
